name: VS Code extension release

on:
  push:
    tags: ['vscode-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json
      # The extension bundles the engine from src/.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - name: Tag matches the extension version
        run: test "$GITHUB_REF_NAME" = "vscode-v$(node -p "require('./package.json').version")"
      - run: npm run typecheck
      - run: npx vsce package --no-dependencies --out turntax.vsix
      # For a manual upload at https://marketplace.visualstudio.com/manage when no VSCE_PAT is set.
      - uses: actions/upload-artifact@v4
        with:
          name: turntax-vsix
          path: vscode/turntax.vsix
      # Open VSX needs the publisher namespace once.
      - name: Open VSX namespace
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' https://open-vsx.org/api/torut)
          if [ "$status" = 404 ]; then npx ovsx create-namespace torut; elif [ "$status" != 200 ]; then echo "open-vsx.org returned $status" && exit 1; fi
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - run: npx ovsx publish turntax.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # Secrets cannot be tested in `if`; this step says whether one is set.
      - id: marketplace
        run: echo "token=$([ -n "$VSCE_PAT" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: VS Code Marketplace
        if: steps.marketplace.outputs.token == 'yes'
        run: npx vsce publish --packagePath turntax.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
