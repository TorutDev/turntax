name: VS Code extension release

on:
  push:
    tags: ['vscode-v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json
      # The extension bundles the engine from src/.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - name: Tag matches the extension version
        run: test "$GITHUB_REF_NAME" = "vscode-v$(node -p "require('./package.json').version")"
      - run: npm run typecheck
      - run: npx vsce package --no-dependencies --out turntax.vsix
      # For a manual upload at https://marketplace.visualstudio.com/manage when no VSCE_PAT is set.
      - uses: actions/upload-artifact@v4
        with:
          name: turntax-vsix
          path: vscode/turntax.vsix
      # Secrets cannot be tested in `if`; this step says whether one is set.
      - id: marketplace
        run: echo "token=$([ -n "$VSCE_PAT" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: VS Code Marketplace
        if: steps.marketplace.outputs.token == 'yes'
        run: npx vsce publish --packagePath turntax.vsix --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  # Open VSX trusted publishing: a short-lived OIDC token instead of a stored one. The registration on
  # open-vsx.org names this repository and this workflow file, with no environment. Only this job can
  # request the token; it installs ovsx from vscode/package-lock.json without install scripts.
  open-vsx:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            vscode/package.json
            vscode/package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: turntax-vsix
      - run: npm ci --ignore-scripts
      - run: npx ovsx publish ../turntax.vsix --trusted-publishing --skip-duplicate
