name: Docs watch

on:
  schedule:
    # 07:00 UTC every Monday.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Read the last run's snapshot.
  actions: read
  # Open or update the docs-watch issue.
  issues: write

concurrency:
  group: docs-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Get the last snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run=$(gh run list --repo "$REPO" --workflow docs-watch.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "No earlier run; this one records the first snapshot."
          elif ! gh run download "$run" --repo "$REPO" --name docs-snapshot --dir "$RUNNER_TEMP/previous"; then
            echo "::warning::Could not read the snapshot of run $run; this run records a new one and reports no changes."
          fi
      - name: Compare with it
        id: compare
        run: node scripts/docs-watch.mjs --previous "$RUNNER_TEMP/previous" --out "$RUNNER_TEMP/current" --report "$RUNNER_TEMP/report.md"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-snapshot
          path: ${{ runner.temp }}/current
          retention-days: 90
          if-no-files-found: error
      # Last: when this fails the run is not "success", so the next run compares with the older snapshot and reports again.
      - name: Open or update the issue
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create docs-watch --repo "$REPO" --color c5def5 --description 'A page behind the loading rules changed' --force
          number=$(gh issue list --repo "$REPO" --label docs-watch --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --repo "$REPO" --title 'Docs watch: pages behind the loading rules changed' --label docs-watch --body-file "$RUNNER_TEMP/report.md"
          fi
