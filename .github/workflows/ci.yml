name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Many tests copy fixtures into the temp folder. On Windows runners that folder is on C:, the OS disk,
      # which is much slower than D: and can stall for seconds (actions/runner-images#8755).
      - run: npm test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - run: npm run build
      - run: npm run build:web
      - run: node dist/bin.js test/fixtures/mixed --json > /dev/null
        shell: bash

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json
      # The extension bundles the engine from src/; the integration test compares with the CLI in dist/.
      - run: npm ci && npm run build
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The tokenizer belongs in dist/worker.js; the main thread must stay small to activate quickly.
      - name: dist/extension.js is at most 500 kB
        run: |
          size=$(stat -c %s dist/extension.js)
          echo "dist/extension.js: $size bytes"
          test "$size" -le 500000
      - run: npx vsce package --no-dependencies
      - run: xvfb-run -a npm test
