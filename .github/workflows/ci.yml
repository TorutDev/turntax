name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      - run: node dist/bin.js test/fixtures/mixed --json > /dev/null
        shell: bash

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json
      # The extension bundles the engine from src/; the integration test compares with the CLI in dist/.
      - run: npm ci && npm run build
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx vsce package --no-dependencies
      - run: xvfb-run -a npm test
