# `language: system` with the published package: `language: node` installs this repository as a git dependency,
# which runs its build and fails on Windows (npm ENOTEMPTY). Keep the version equal to package.json.
- id: turntax
  name: turntax
  description: Fail when an agent's instruction files go over a per-turn token budget (--max-tokens, or maxTokens in turntax.config.json).
  entry: npx --yes turntax@0.11.0
  language: system
  pass_filenames: false
  always_run: true
